<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161e38"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="tableHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>

  <!-- Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Table Body / Card Container -->
  <g transform="translate(86, 96)">
    <!-- Inner Table Card -->
    <rect x="0" y="0" width="340" height="260" rx="24" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="2.5"/>

    <!-- Table Header Row -->
    <rect x="0" y="0" width="340" height="64" rx="24" fill="url(#tableHeadGrad)"/>
    <!-- Patch bottom corners of header -->
    <rect x="0" y="44" width="340" height="20" fill="url(#tableHeadGrad)"/>

    <!-- Header Column Dividers -->
    <line x1="110" y1="0" x2="110" y2="64" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="225" y1="0" x2="225" y2="64" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Header Cell Indicators -->
    <rect x="24" y="25" width="62" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="134" y="25" width="67" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="249" y="25" width="67" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Horizontal Row Dividers -->
    <line x1="0" y1="128" x2="340" y2="128" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="194" x2="340" y2="194" stroke="#1e293b" stroke-width="2"/>

    <!-- Vertical Column Dividers -->
    <line x1="110" y1="64" x2="110" y2="260" stroke="#1e293b" stroke-width="2"/>
    <line x1="225" y1="64" x2="225" y2="260" stroke="#1e293b" stroke-width="2"/>

    <!-- Row 1 Data Pills -->
    <rect x="24" y="88" width="50" height="16" rx="8" fill="#38bdf8" fill-opacity="0.4"/>
    <rect x="134" y="88" width="64" height="16" rx="8" fill="#a855f7" fill-opacity="0.35"/>
    <rect x="249" y="88" width="46" height="16" rx="8" fill="#10b981" fill-opacity="0.35"/>

    <!-- Row 2 Data Pills -->
    <rect x="24" y="153" width="68" height="16" rx="8" fill="#38bdf8" fill-opacity="0.3"/>
    <rect x="134" y="153" width="45" height="16" rx="8" fill="#a855f7" fill-opacity="0.25"/>
    <rect x="249" y="153" width="62" height="16" rx="8" fill="#10b981" fill-opacity="0.3"/>

    <!-- Row 3 Data Pills -->
    <rect x="24" y="219" width="42" height="16" rx="8" fill="#38bdf8" fill-opacity="0.25"/>
    <rect x="134" y="219" width="58" height="16" rx="8" fill="#a855f7" fill-opacity="0.2"/>
    <rect x="249" y="219" width="48" height="16" rx="8" fill="#10b981" fill-opacity="0.25"/>
  </g>

  <!-- Lumio Spark / Lightning Badge -->
  <g transform="translate(325, 295)" filter="url(#glow)">
    <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="4"/>
    <!-- Lightning Bolt -->
    <polygon points="56 18 32 50 48 50 44 82 72 44 54 44 56 18" fill="url(#boltGrad)"/>
  </g>

  <!-- CSV Monogram Typography Badge -->
  <g transform="translate(92, 385)">
    <rect x="0" y="0" width="168" height="52" rx="14" fill="#030712" fill-opacity="0.8" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
    <text x="84" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#00f0ff" text-anchor="middle" filter="url(#softGlow)">CSV</text>
  </g>
</svg>
